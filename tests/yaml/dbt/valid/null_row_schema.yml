
version: 2

models:
  - name: revenue_test_null_row
    description: "An example revenue model"
    tags:
      - eppo_fact_source
    meta:
      eppo_row_fact:
        name: "Example Row Fact"
        desired_change: "increase"
    columns:
      - name: revenue_id
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
      - name: anonymous_id
        tags:
          - eppo_entity:Anonymous User
      - name: purchase_timestamp
        description: "The time at which the revenue was created"
        tests:
          - not_null
        tags:
          - eppo_timestamp
      - name: revenue_source_test
        description: "The gross revenue source"
        tags: 
          - eppo_property
