
version: 2

models:
  - name: revenue_test_dbt_fact_names
    description: "An example revenue model"
    tags:
      - eppo_fact_source
    columns:
      - name: revenue_id
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
      - name: anonymous_id
        tags:
          - eppo_entity:Anonymous User
      - name: is_from_ad_campaign
        description: "Whether the revenue was generated from an ad campaign"
        tests:
          - not_null
        tags:
          - eppo_fact:Is From Ad Campaign:increase
      - name: purchase_timestamp
        description: "The time at which the revenue was created"
        tests:
          - not_null
        tags:
          - eppo_timestamp
      - name: revenue_source_test
        description: "The gross revenue source"
        tags: 
          - eppo_property
